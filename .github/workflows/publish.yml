name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.11"
    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    - name: Build sdist and wheel
      run: python -m build
    - name: Check distributions
      run: twine check --strict dist/*
    - name: Upload distributions
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Uses PyPI Trusted Publishing (OIDC); no API token secret is required.
    # Configure the publisher for this repository and workflow at
    # https://pypi.org/manage/project/pytactl/settings/publishing/
    environment:
      name: pypi
      url: https://pypi.org/p/pytactl
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Download distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist/
    - name: Publish
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
